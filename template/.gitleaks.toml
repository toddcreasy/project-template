# Gitleaks config: the default rule set (API keys, tokens, private keys) plus personal info.
# Runs in pre-commit on staged changes and in CI over the full history.
# A finding that is fine to commit: add `gitleaks:allow` as a comment on that line.

title = "project-template gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "personal-email"
description = "Personal email address (consumer mail domain)"
regex = '''(?i)\b[a-z0-9._%+-]+@(?:gmail|googlemail|yahoo|ymail|hotmail|outlook|live|msn|icloud|me|mac|aol|proton|protonmail|pm|comcast|verizon|att)\.(?:com|net|me)\b'''
keywords = ["@gmail", "@googlemail", "@yahoo", "@ymail", "@hotmail", "@outlook", "@live", "@msn", "@icloud", "@me.", "@mac.", "@aol", "@proton", "@pm.", "@comcast", "@verizon", "@att."]

[[rules]]
id = "us-phone-number"
description = "US phone number"
regex = '''(?:\+?1[-.\s]?)?\(?\b[2-9][0-9]{2}\)?[-.\s][2-9][0-9]{2}[-.\s][0-9]{4}\b'''

[[rules]]
id = "us-ssn"
description = "US Social Security number"
regex = '''\b[0-8][0-9]{2}-[0-9]{2}-[0-9]{4}\b'''

[[rules]]
id = "street-address"
description = "US street address"
regex = '''\b[0-9]{2,6}\s+(?:[A-Z][a-z]+\s){1,3}(?:Street|St|Avenue|Ave|Road|Rd|Drive|Dr|Lane|Ln|Court|Ct|Boulevard|Blvd|Way|Terrace|Ter|Place|Pl|Circle|Cir)\b\.?'''

[[allowlists]]
description = "Lockfiles hold hashes, not secrets"
paths = [
  '''(?:^|/)uv\.lock$''',
  '''(?:^|/)\.terraform\.lock\.hcl$''',
  '''(?:^|/)package-lock\.json$''',
]
